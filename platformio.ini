; PlatformIO Project Configuration for ESP32-S3 WROOM CAM Robot
; Configured for 16MB Flash, 8MB Octal PSRAM, OV2640 Camera, and SDMMC MicroSD

[platformio]
default_envs = esp32s3_cam
src_dir = src
include_dir = include

[env:esp32s3_cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Upload and Monitor settings
upload_speed = 921600
monitor_speed = 115200
upload_port = /dev/cu.usbmodem5D160824921
monitor_port = /dev/cu.usbmodem5D160824921

; Memory configuration for 16MB Flash, 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
